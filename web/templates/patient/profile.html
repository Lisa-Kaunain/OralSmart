{% extends "base.html" %}
{% block title %}My profile · OralSmart AI{% endblock %}
{% block content %}
<div class="dashboard-page"><div class="container narrow-container">
  <div class="page-heading"><div><span class="section-kicker">ACCOUNT SETTINGS</span><h1>My profile</h1><p>Keep your contact details up to date.</p></div></div>
  <section class="panel-card profile-panel"><form method="post" class="form-stack">
    <label for="name">Full name</label><input class="form-control" id="name" name="name" value="{{ user.name }}" maxlength="120" required>
    <label for="email">Email address</label><input class="form-control" id="email" value="{{ user.email }}" disabled><small class="form-hint">Email cannot be changed in this prototype.</small>
    <label for="phone">Phone</label><input class="form-control" id="phone" name="phone" value="{{ user.phone or '' }}" maxlength="40" type="tel">
    <label>Account type</label><div class="role-display"><i class="bi bi-person-heart"></i> Patient</div>
    <button type="submit" class="btn btn-primary align-self-start">Save changes</button>
  </form></section>
</div></div>
{% endblock %}
