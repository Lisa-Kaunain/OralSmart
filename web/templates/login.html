{% extends "base.html" %}
{% block title %}Log in · OralSmart AI{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-card">
  <div class="auth-heading"><div class="feature-icon icon-mint"><i class="bi bi-person-check"></i></div><span class="section-kicker">Welcome back</span><h1>Log in to OralSmart</h1><p>Your oral-care journey, all in one place.</p></div>
  <form method="post" class="form-stack">
    <label for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Log in <i class="bi bi-arrow-right ms-2"></i></button>
  </form>
  <p class="auth-switch">New to OralSmart? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></section>
{% endblock %}
